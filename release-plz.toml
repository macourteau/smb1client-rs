[workspace]
# Which prefixes release at all. release-plz bumps a patch for ANY unreleased
# commit by default, so the commit convention's "no release" row is this regex
# and nothing else. The `!` alternative is load-bearing: a breaking change is
# marked by the `!`, not by the type carrying it, so `refactor!:` must release
# while `refactor:` must not. `commit_parsers`/`skip` is not a substitute — it
# groups the changelog and does not affect the version bump.
release_commits = '^feat[(!:]|^fix[(!:]|^[a-z]+(\([^)]*\))?!:'

# The changelog is the release note: generated release notes read from merged
# pull requests, and this repository's history is not pull-request shaped.
changelog_update = true
git_release_enable = true
git_tag_enable = true

# The crate stays pre-1.0 until its API has been exercised by a real consumer.
# Under Cargo's semantics every 0.x minor is incompatible, so a breaking change
# is a minor bump and what protects a consumer from an unreviewed breaking
# release is the resolver rather than review.
allow_dirty = false
# `package.publish` in Cargo.toml is the guard that does not depend on this file
# being read; the workflow's RELEASE_ENABLED gate is the one that stops the
# workflow running at all.
publish = true
