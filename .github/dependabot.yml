version: 2

# Note what is deliberately absent: there is no `docker` ecosystem entry, and
# adding one would be a mistake rather than an improvement. The only Dockerfile
# here is `.ci/samba/Dockerfile`, the acceptance container, which is the entire
# automatic acceptance gate. Some distributions build Samba without the SMB1
# server and upstream is actively removing SMB1 server support, so an automerged
# base-image bump that silently produced a container which no longer speaks NT1
# would delete the oracle rather than fail loudly. There is no consumer exposure
# and no advisory pressure, so there is no reason to update it except
# deliberately. See `.ci/samba/README.md`.

updates:
  # Cargo is deliberately ungrouped. The automerge workflow withholds automerge
  # from any pre-1.0 dependency's minor bump, and that decision reads
  # `previous-version` from the update's metadata — which is not meaningful on a
  # grouped pull request, where `update-type` is the highest change across the
  # whole group. Grouping here would silently defeat the floor.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope

  # `fuzz/` is its own workspace with its own lockfile, so Cargo's entry above
  # does not reach it and an unlisted lockfile is one nothing updates. It is
  # ungrouped for the same reason the crate's own entry is.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    ignore:
      # dtolnay/rust-toolchain's version-shaped refs are *Rust* versions, not
      # action versions: `@1.98` is a branch that installs Rust 1.98.0. So a
      # Dependabot bump here does not update an action, it changes the compiler
      # CI builds with — and it will happily propose a Rust that does not exist,
      # which is what it did on its first run, offering 1.100 while stable was
      # 1.98. The required check caught it; the point of this rule is that it
      # should never have been proposed.
      #
      # Moving the pin is a deliberate decision, and the weekly `Specification
      # drift` workflow is what signals when it is worth making: it runs clippy
      # on current stable without gating anything, so a new lint arrives as a
      # note rather than as a blocked merge.
      - dependency-name: dtolnay/rust-toolchain
