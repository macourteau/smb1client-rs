name: Fuzz

# Weekly and scheduled, deliberately not a pull-request check: fuzzing on a pull
# request either finds nothing within the budget it is given or blocks a merge
# on a run nobody sized for it. The job exists because a fuzz target nobody runs
# is decoration — it compiles, it is never exercised, and the crate's hardening
# claim is the thing that rests on it.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The four parsers an unauthenticated peer can reach. They are not a
        # trust boundary — the crate does not sign, so it never authenticates
        # the server at any point — they are where hardening starts.
        target: [frame, negotiate_response, spnego, ntlm_challenge]
    steps:
      - uses: actions/checkout@v7
      # A legible failure rather than a confusing one from cargo-fuzz. The four
      # targets are written alongside the parsers they cover, so this job is red
      # from the moment it is scheduled until they land — which is the pressure
      # it exists to apply. A fuzz target nobody runs is decoration.
      - name: Check the targets exist
        run: |
          test -f fuzz/Cargo.toml || {
            echo "fuzz/ does not exist: the four fuzz targets the design record" >&2
            echo "requires are written with the parsers they cover." >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # `cargo fuzz` defaults `--target` to the triple it was itself built for,
      # and the prebuilt binary installed above is a musl one. Left to default it
      # therefore builds the fuzzers against a musl std that this gnu toolchain
      # does not carry — and a sanitizer cannot instrument a statically linked
      # libc in any case, so the two errors arrive together. Naming the host
      # triple keeps the fuzzers on the toolchain actually installed.
      - run: |
          cargo fuzz run --target "$(rustc -vV | sed -n 's/^host: //p')" \
            ${{ matrix.target }} -- -max_total_time=600
