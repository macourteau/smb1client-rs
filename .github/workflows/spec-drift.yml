name: Specification drift

# The generated status table is checked against its source on a schedule rather
# than per pull request. Regenerating reaches out to learn.microsoft.com, and a
# third-party fetch in the critical path of every merge is a flake that blocks
# work without finding anything: [MS-ERREF] and SMB1 are both frozen, so drift
# here would be a correction to the specification, not a routine event.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    name: Clippy on current stable
    runs-on: ubuntu-latest
    # Deliberately not a required check and deliberately not gating anything.
    # CI pins its toolchain so a new lint cannot block a merge; this is what
    # makes sure a new lint is still seen. A failure here is a note to bump the
    # pin in ci.yml, not a defect.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  status-table:
    name: NT status table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/gen_status.py --check
