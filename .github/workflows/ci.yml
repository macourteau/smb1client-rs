name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Cheap early warning that packaging works at all: it catches an `exclude`
      # that drops a file the build needs, which no ordinary build ever sees.
      - run: cargo package --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The 2024 edition's resolver is MSRV-aware for dependency *selection*
      # only. It does not check that this crate's own code compiles on the
      # floor it declares, so without this job the declared version is an
      # unverified claim and a consumer is the one who discovers the lie.
      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo "Cargo.toml declares no rust-version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  deny:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Development dependencies need no configuration to be covered: they are
      # in the graph already, `[graph] exclude-dev` defaulting to false.
      - run: cargo deny check

  acceptance:
    name: Acceptance
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start the pinned SMB1 server
        run: |
          docker build -t smb1client-acceptance .ci/samba
          docker run -d --name smb1client-acceptance -p 10445:445 smb1client-acceptance
          for _ in $(seq 1 30); do
            docker exec smb1client-acceptance smbclient -L //127.0.0.1 \
              -U smbtest%smbtest >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Seed the share
        run: docker exec smb1client-acceptance /usr/local/bin/seed.sh
      # Deliberately after seeding, and deliberately a script rather than an
      # smbclient invocation: smbclient exits 0 when protocol negotiation fails,
      # so a check reading its exit status passes against a container that has
      # lost SMB1 — which is the one thing this container exists to make
      # impossible. The script asserts on output, and on seeded content.
      - name: Prove the server still speaks NT1
        run: docker exec smb1client-acceptance /usr/local/bin/assert-nt1.sh
      - name: Run the acceptance suite
        env:
          SMB1_TEST_SERVER: 127.0.0.1:10445
          SMB1_TEST_SHARE: testshare
          SMB1_TEST_USER: smbtest
          SMB1_TEST_PASSWORD: smbtest
        run: cargo test --locked -- --include-ignored
      - name: Server log
        if: always()
        run: docker logs smb1client-acceptance 2>&1 | tail -100

  # The single required check. It exists so that the acceptance job can be
  # skipped on pull requests without a required check pending forever, and so
  # that adding a job later does not mean re-pointing branch protection.
  ci-ok:
    name: CI
    runs-on: ubuntu-latest
    needs: [build-test, msrv, deny, acceptance]
    if: always()
    steps:
      - name: Fail unless every job succeeded or was deliberately skipped
        run: |
          results='${{ join(needs.*.result, " ") }}'
          echo "Results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "A required job reported '$r'" >&2; exit 1 ;;
            esac
          done
